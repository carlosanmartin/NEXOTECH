<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title">
  <title id="title">Ilustración de computador portátil tecnológico</title>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="440" rx="300" ry="40"
           fill="#2563eb" opacity=".25" filter="url(#glow)"/>

  <rect x="125" y="45" width="550" height="365" rx="20"
        fill="#020617" stroke="#475569" stroke-width="8"/>

  <rect x="145" y="65" width="510" height="325" rx="8"
        fill="url(#screen)"/>

  <circle cx="400" cy="55" r="4" fill="#94a3b8"/>

  <path d="M90 410 H710 L765 450 Q775 465 750 470 H50 Q25 465 35 450 Z"
        fill="url(#body)"/>

  <path d="M320 410 H480 L505 435 H295 Z"
        fill="#0f172a" opacity=".8"/>

  <path d="M300 170 L400 115 L500 170 L500 280 L400 335 L300 280 Z"
        fill="none" stroke="#93c5fd" stroke-width="5" opacity=".65"/>

  <text x="400" y="250" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="80" font-weight="900"
        fill="white">N</text>

  <path d="M180 340 H620" stroke="#93c5fd"
        stroke-width="2" opacity=".4"/>
</svg>
